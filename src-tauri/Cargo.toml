[package]
name = "it_quest"
version = "1.1.0"
description = "IT Quest: learn IT skills, languages and certifications from zero"
authors = ["Jakub"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
