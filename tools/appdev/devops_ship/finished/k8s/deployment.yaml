apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  labels: { app: ticket-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ticket-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 2 pods while rolling out
  template:
    metadata:
      labels: { app: ticket-api }
      annotations:
        prometheus.io/scrape: "true"                     # for annotation-based scraping
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/OWNER/ticket-api        # kustomization.yaml sets the tag
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
