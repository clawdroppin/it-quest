# kubectl apply -k k8s/     (the pipeline sets the image tag with: kustomize edit set image ...)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tickets
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/OWNER/ticket-api
    newName: ghcr.io/OWNER/ticket-api
    newTag: "0.1.0"
